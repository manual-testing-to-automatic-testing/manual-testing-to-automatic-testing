# CI for the practice repository (Module 11).
# Runs on every pull request and every push to main. A failing job blocks the merge
# once branch protection requires these checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets and personal data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for repositories owned by a GitHub organisation.
          # Free licence keys: https://gitleaks.io
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  static:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  katas:
    name: Katas (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:katas
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: results-katas
          path: test-results/
          retention-days: 14

  ui:
    name: Browser tests (fixture site)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner has Google Chrome; Selenium Manager fetches the matching
      # driver. CI is set, so the driver factory runs Chrome headless.
      - run: npm run test:ui -- --grep @quarantine --invert
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: results-ui
          # JUnit XML, plus a screenshot, page source, and console log for
          # every failed test.
          path: test-results/
          retention-days: 14

  api:
    name: API tests (FHIR sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The tests start the local FHIR sandbox themselves: no service container.
      - run: npm run test:api -- --grep @quarantine --invert
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: results-api
          path: test-results/
          retention-days: 14
