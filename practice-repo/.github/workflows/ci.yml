# CI for the practice repository (module M7).
# Runs on every pull request and every push to main. A failing job blocks the merge
# once branch protection requires these checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets and personal data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for repositories owned by a GitHub organisation.
          # Free licence keys: https://gitleaks.io
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  static:
    name: Typecheck, lint, and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  katas:
    name: Katas (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:katas

  ui:
    name: Browser tests (fixture site)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ui
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  api:
    name: API tests (FHIR sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      fhir:
        image: hapiproject/hapi:v8.12.0-2
        ports:
          - 8080:8080
        env:
          hapi.fhir.fhir_version: R4
          hapi.fhir.allow_external_references: 'true'
          hapi.fhir.enforce_referential_integrity_on_write: 'false'
    env:
      FHIR_BASE_URL: http://localhost:8080/fhir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Load synthetic data and profile
        run: sh fhir-sandbox/scripts/load.sh "$FHIR_BASE_URL"
      - run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            test-results/
          retention-days: 14
